<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draco Planning — Informes · Visor</title>
    <script>if(new URLSearchParams(location.search).get("informe_id")&&new URLSearchParams(location.search).get("lista")!=="1") document.documentElement.classList.add("vw-full");</script>
    <link rel="stylesheet" href="css/theme.css?v=20260830c">
    <link rel="stylesheet" href="css/modal.css?v=20260830c">
    <link rel="stylesheet" href="css/app.css?v=20261012c">
    <link rel="stylesheet" href="css/informes.css?v=20261011a">
</head>
<body class="informes-page">

    <!-- ===================== TOPBAR ===================== -->
    <header class="app-topbar">
        <div class="app-topbar-brand">
            <div class="app-logo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M3 7l9 5 9-5M12 12v10" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="app-topbar-titles">
                <span class="app-topbar-title">Draco Planning · Informes · Visor</span>
                <span class="app-topbar-subtitle" id="gcpProjectLabel">Conectando...</span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="app-topbar-status is-live" id="connStatus"><span class="dot"></span>BigQuery</span>
            <a class="app-topbar-action" href="generador.html" id="linkGenerador" title="Ir al generador de informes" style="text-decoration:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </a>
            <a class="app-topbar-action" href="app.html" title="Ir a Administración" style="text-decoration:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-6 8 6v12h-5v-7H9v7H4z"/></svg>
            </a>
            <button class="app-topbar-action" id="btnLogout" title="Cerrar sesión">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                    <path d="M16 17l5-5-5-5"/>
                    <path d="M21 12H9"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ===================== BARRA DE PROYECTO (solo selección) ===================== -->
    <div class="project-bar">
        <label for="projectSelect">Proyecto</label>
        <select id="projectSelect">
            <option value="">Cargando proyectos...</option>
        </select>
        <div class="project-bar-desc" id="projectDescription"></div>
    </div>

    <!-- ===================== VISOR ===================== -->
    <div class="vw-layout" id="vwLayout">
        <aside class="vw-side" id="vwSide">
            <div class="vw-side-head">
                <input type="search" id="vwSearch" placeholder="Buscar informe…" autocomplete="off">
            </div>
            <div class="vw-list" id="vwList"><div class="module-empty">Cargando informes...</div></div>
        </aside>
        <section class="vw-stage">
            <div class="vw-toolbar" id="vwToolbar" hidden>
                <button class="btn btn-secondary btn-sm" id="btnToggleSide" title="Ocultar o mostrar la lista de informes">☰ Lista</button>
                <div class="vw-title" id="vwTitle"></div>
                <button class="btn btn-secondary btn-sm" id="btnFav" title="Marcar como favorito">☆ Favorito</button>
                <button class="btn btn-secondary btn-sm" id="btnReload" title="Volver a cargar el informe">↻ Recargar</button>
                <button class="btn btn-secondary btn-sm" id="btnFull" title="Ver solo el informe, sin barras">⛶ Completo</button>
                <button class="btn btn-secondary btn-sm" id="btnLink" title="Copiar el enlace directo (muestra solo el informe)">🔗 Enlace</button>
                <button class="btn btn-secondary btn-sm" id="btnEditar" title="Abrir en el generador (nueva pestaña)">✎ Editar</button>
            </div>
            <div class="vw-view">
                <div class="vw-empty" id="vwEmpty">Selecciona un informe de la lista para abrirlo.</div>
                <iframe id="viewerFrame" title="Informe" hidden></iframe>
            </div>
        </section>
    </div>

    <div class="vw-fab" id="vwFab">
        <button type="button" id="fabFs" title="Pantalla completa del navegador (Esc para salir)" aria-label="Pantalla completa">⛶</button>
        <button type="button" id="fabExit" title="Volver al visor con la lista de informes" aria-label="Volver al visor">☰</button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js?v=20260906a"></script>
    <script src="js/bigquery.js?v=20260906a"></script>
    <script src="js/snowflake.js?v=20260830c"></script>
    <script src="js/provider.js?v=20260906c"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="js/schema.js?v=20261011a"></script>
    <script src="js/ui.js?v=20260907a"></script>
    <script src="js/table-updates.js?v=20261012a"></script>
    <script src="js/informes.js?v=20261011a"></script>
    <script src="js/informes-datos.js?v=20261011a"></script>
    <script src="js/draco-tables.js?v=20261012b"></script>
    <script src="js/visor-app.js?v=20261012c"></script>
    <script>VisorApp.init();</script>
</body>
</html>

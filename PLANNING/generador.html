<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draco Planning — Informes · Generador</title>
    <link rel="stylesheet" href="css/theme.css?v=20260830c">
    <link rel="stylesheet" href="css/modal.css?v=20260830c">
    <link rel="stylesheet" href="css/app.css?v=20261012c">
    <link rel="stylesheet" href="css/informes.css?v=20261018a">
    <link rel="stylesheet" href="css/draco-tables.css?v=20261022c">
    <script src="js/i18n.js?v=20261022w"></script>
    <script src="js/i18n/en-addin.js?v=20261022w"></script>
    <script src="js/i18n/en.js?v=20261022w"></script>
</head>
<body class="informes-page">

    <!-- ===================== TOPBAR ===================== -->
    <header class="app-topbar">
        <div class="app-topbar-brand">
            <div class="app-logo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M3 7l9 5 9-5M12 12v10" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="app-topbar-titles">
                <span class="app-topbar-title">Draco Planning · Informes · Generador</span>
                <span class="app-topbar-subtitle" id="gcpProjectLabel">Conectando...</span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="app-topbar-status is-live" id="connStatus"><span class="dot"></span>BigQuery</span>
            <a class="app-topbar-action" href="visor.html" id="linkVisor" title="Ir al visor de informes" style="text-decoration:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </a>
            <a class="app-topbar-action" href="app.html" title="Ir a Administración" style="text-decoration:none;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-6 8 6v12h-5v-7H9v7H4z"/></svg>
            </a>
            <button class="app-topbar-action" id="btnLogout" title="Cerrar sesión">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                    <path d="M16 17l5-5-5-5"/>
                    <path d="M21 12H9"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- ===================== BARRA DE PROYECTO (solo selección) ===================== -->
    <div class="project-bar">
        <label for="projectSelect">Proyecto</label>
        <select id="projectSelect">
            <option value="">Cargando proyectos...</option>
        </select>
        <div class="project-bar-desc" id="projectDescription"></div>
    </div>

    <!-- ===================== HERRAMIENTA DE INFORMES ===================== -->
    <main class="informes-main" id="toolMain">
        <div class="informes-empty" id="toolEmpty">Selecciona un proyecto en la barra superior para diseñar sus informes.</div>
        <iframe id="toolFrame" title="Generador de informes" hidden></iframe>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js?v=20261022w"></script>
    <script src="js/bigquery.js?v=20261027b"></script>
    <script src="js/google-auth.js?v=20261022w"></script>
    <script src="js/provider.js?v=20261022w"></script>
    <script src="vendor/xlsx.full.min.js?v=0.20.3"></script>
    <script src="js/schema.js?v=20261022w"></script>
    <script src="js/ui.js?v=20261022w"></script>
    <script src="js/table-updates.js?v=20261022w"></script>
    <script src="js/informes.js?v=20261022w"></script>
    <script src="js/informes-datos.js?v=20261022w"></script>
    <script src="js/storage.js?v=20261022w"></script>
    <script src="js/flow-run.js?v=20261022w"></script>
    <script src="js/informes-flujos.js?v=20261022a"></script>
    <!-- Tablas Draco: el diseñador resuelve el modelo de cada cubo (.lkml en GitHub) -->
    <script src="js/github-repo.js?v=20261022w"></script>
    <script src="js/lkml-parse.js?v=20260906c"></script>
    <script src="js/dimensions.js?v=20260830c"></script>
    <script src="js/semantic-model.js?v=20261022w"></script>
    <script src="js/draco-tables.js?v=20261027a"></script>
    <script src="js/draco-table-designer.js?v=20261022w"></script>
    <script src="js/generador-app.js?v=20261027a"></script>
    <script>GeneradorApp.init();</script>
</body>
</html>

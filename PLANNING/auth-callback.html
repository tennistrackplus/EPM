<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Draco Planning · Autenticando...</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--surface-page);
        }
        .box {
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--fs-md);
        }
    </style>
    <script src="js/i18n.js?v=20261022w"></script>
    <script src="js/i18n/en.js?v=20261022w"></script>
</head>
<body>
    <div class="box">Completando el inicio de sesión...</div>
    <script>
        (function () {
            function parseHashParams(hash) {
                const params = {};
                (hash || "").replace(/^#/, "").split("&").forEach(pair => {
                    if (!pair) return;
                    const [k, v] = pair.split("=");
                    params[decodeURIComponent(k)] = decodeURIComponent(v || "");
                });
                return params;
            }

            const params = parseHashParams(window.location.hash);
            // Se borra el fragmento de la URL para que el token no quede en el historial.
            try { history.replaceState(null, "", window.location.pathname); } catch (e) { /* noop */ }
            let payload;

            if (params.access_token) {
                payload = JSON.stringify({
                    status: "success",
                    provider: "bigquery",
                    token: params.access_token,
                    expiresIn: params.expires_in || "3600",
                    state: params.state || null,
                    session: params.session || null,
                    scope: params.scope || null
                });
            } else {
                payload = JSON.stringify({
                    status: "error",
                    provider: "bigquery",
                    error: params.error || "No se recibió ningún token de acceso.",
                    state: params.state || null
                });
            }

            if (window.opener) {
                window.opener.postMessage(payload, window.location.origin);
                window.close();
            } else {
                // Sin ventana de origen (el navegador bloqueó window.opener):
                // el token NO se guarda aquí; hay que volver a conectar desde la app.
                document.querySelector(".box").textContent =
                    "No se ha podido devolver la sesión a Draco Planning. Cierra esta ventana y vuelve a pulsar «Conectar».";
            }
        })();
    </script>
</body>
</html>

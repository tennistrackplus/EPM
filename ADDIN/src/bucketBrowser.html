<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir desde bucket</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: var(--font-family, -apple-system, Segoe UI, Arial, sans-serif);
            box-sizing: border-box;
        }
        .wrap {
            box-sizing: border-box;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: 14px;
            margin: 0 0 4px 0;
            color: #333;
        }
        #bucketLabel {
            font-size: 11px;
            color: #777;
            margin-bottom: 10px;
            word-break: break-all;
        }
        #state {
            font-size: 12.5px;
            color: #666;
            padding: 10px 0;
        }
        #state.error { color: #c0392b; }
        ul#list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
            border-top: 1px solid #eee;
        }
        li.item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        li.item:hover { background: #f6f3fa; }
        .item-info { min-width: 0; }
        .item-name {
            font-size: 12.5px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-meta {
            font-size: 10.5px;
            color: #999;
            margin-top: 2px;
        }
        .item-btn {
            flex-shrink: 0;
            padding: 5px 12px;
            font-size: 11.5px;
            border: none;
            border-radius: 4px;
            background: #7045A9;
            color: #fff;
            cursor: pointer;
        }
        .item-btn:disabled { opacity: 0.5; cursor: default; }
        .item-btn:hover:not(:disabled) { opacity: 0.9; }
        #closeBtn {
            margin-top: 12px;
            align-self: flex-end;
            padding: 7px 16px;
            font-size: 12.5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Abrir desde bucket</h1>
        <div id="bucketLabel"></div>
        <div id="state">Cargando archivos…</div>
        <ul id="list"></ul>
        <button id="closeBtn" type="button">Cerrar</button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/bigquery.js"></script>
    <script src="js/gcsExport.js"></script>
    <script>
        function fmtSize(bytes) {
            const n = Number(bytes) || 0;
            if (n < 1024) return n + " B";
            if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
            return (n / (1024 * 1024)).toFixed(1) + " MB";
        }

        function fmtDate(iso) {
            try {
                return new Date(iso).toLocaleString();
            } catch (e) {
                return iso || "";
            }
        }

        async function loadList() {
            const stateEl = document.getElementById("state");
            const listEl = document.getElementById("list");
            const bucketLabelEl = document.getElementById("bucketLabel");

            const bucket = (window.BQ && BQ.getExportBucket && BQ.getExportBucket()) || "";
            bucketLabelEl.textContent = bucket ? `Bucket: ${bucket}` : "";

            try {
                const items = await GCS.listXlsxObjects();
                if (!items.length) {
                    stateEl.textContent = "No hay archivos .xlsx en este bucket todavía.";
                    return;
                }
                stateEl.textContent = "";
                listEl.innerHTML = "";
                items.forEach(item => {
                    const li = document.createElement("li");
                    li.className = "item";

                    const info = document.createElement("div");
                    info.className = "item-info";
                    const name = document.createElement("div");
                    name.className = "item-name";
                    name.textContent = item.name;
                    const meta = document.createElement("div");
                    meta.className = "item-meta";
                    meta.textContent = `${fmtSize(item.size)} · ${fmtDate(item.updated)}`;
                    info.appendChild(name);
                    info.appendChild(meta);

                    const btn = document.createElement("button");
                    btn.className = "item-btn";
                    btn.type = "button";
                    btn.textContent = "Descargar";
                    btn.addEventListener("click", async () => {
                        btn.disabled = true;
                        btn.textContent = "Descargando…";
                        try {
                            await GCS.downloadObjectToBrowser(item.name);
                            btn.textContent = "Descargado ✓";
                        } catch (err) {
                            console.error("Error al descargar del bucket:", err);
                            btn.textContent = "Error";
                            alert("No se pudo descargar el archivo: " + (err.message || err));
                        } finally {
                            setTimeout(() => {
                                btn.disabled = false;
                                btn.textContent = "Descargar";
                            }, 2000);
                        }
                    });

                    li.appendChild(info);
                    li.appendChild(btn);
                    listEl.appendChild(li);
                });
            } catch (err) {
                console.error("Error al listar el bucket:", err);
                stateEl.className = "error";
                stateEl.textContent = err.message || String(err);
            }
        }

        function init() {
            document.getElementById("closeBtn").addEventListener("click", () => {
                try {
                    Office.context.ui.messageParent("close");
                } catch (e) {
                    window.close();
                }
            });
            loadList();
        }

        if (typeof Office !== "undefined") {
            Office.onReady(init);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    </script>
</body>
</html>

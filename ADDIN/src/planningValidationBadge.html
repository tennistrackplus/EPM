<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Validación de planificación</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: "Segoe UI", "Segoe UI Web", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff; cursor: pointer; overflow: hidden;
        }
        .badge {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; text-align: center; padding: 12px;
            color: #ffffff;
        }
        .badge.ok    { background: #107c10; } /* verde: validación correcta */
        .badge.error { background: #a80000; justify-content: flex-start; } /* rojo: faltan dimensiones */
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(255,255,255,0.9); flex-shrink: 0;
        }
        .title { font-size: 13px; font-weight: 600; line-height: 1.3; }
        .subtitle { font-size: 11px; opacity: 0.9; }
        .detalle {
            font-size: 11px; text-align: left; overflow-y: auto;
            width: 100%; flex: 1 1 auto; margin-top: 4px;
            white-space: pre-line; line-height: 1.5;
        }
        .cerrar {
            font-size: 10px; opacity: 0.85; margin-top: 6px; flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="badge" class="badge ok">
        <span class="dot" id="badgeDot"></span>
        <span class="title" id="badgeTitle">Validación de planificación</span>
        <span class="subtitle" id="badgeSubtitle">…</span>
        <div class="detalle" id="badgeDetalle" style="display:none;"></div>
        <span class="cerrar" id="badgeCerrar" style="display:none;">Haz clic para cerrar</span>
    </div>

    <script>
        // Correcto: se cierra solo, igual que recognitionBadge.html.
        // Error: NO se cierra solo (hay una lista que leer) — solo con clic.
        const AUTO_CLOSE_MS = 1400;

        function notifyHostAndClose() {
            try {
                Office.context.ui.messageParent(JSON.stringify({ type: "close" }));
            } catch (e) {
                try { window.close(); } catch (e2) { /* nada más que hacer */ }
            }
        }

        Office.onReady(() => {
            const params = new URLSearchParams(window.location.search);
            const isValid = params.get("valid") === "1";
            const detalle = params.get("detalle") || "";

            const el = document.getElementById("badge");
            el.classList.remove("ok", "error");
            el.classList.add(isValid ? "ok" : "error");

            if (isValid) {
                document.getElementById("badgeTitle").textContent = "Validación correcta";
                document.getElementById("badgeSubtitle").textContent = "Todas las celdas tienen sus dimensiones obligatorias";
                setTimeout(notifyHostAndClose, AUTO_CLOSE_MS);
            } else {
                document.getElementById("badgeDot").style.display = "none";
                document.getElementById("badgeTitle").textContent = "Faltan dimensiones obligatorias";
                document.getElementById("badgeSubtitle").textContent = "Es necesario indicar un valor para las dimensiones:";
                const detalleEl = document.getElementById("badgeDetalle");
                detalleEl.textContent = detalle;
                detalleEl.style.display = "block";
                document.getElementById("badgeCerrar").style.display = "inline";
                // No se auto-cierra: solo al hacer clic.
            }
        });

        document.body.addEventListener("click", notifyHostAndClose);
    </script>
</body>
</html>

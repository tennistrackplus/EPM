<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Reconocimiento de miembros</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: "Segoe UI", "Segoe UI Web", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff; cursor: pointer; overflow: hidden;
        }
        .badge {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; text-align: center; padding: 8px;
            color: #ffffff;
        }
        .badge.on  { background: #107c10; } /* verde: activado  */
        .badge.off { background: #605e5c; } /* gris: desactivado */
        .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(255,255,255,0.9);
        }
        .title { font-size: 13px; font-weight: 600; line-height: 1.3; }
        .subtitle { font-size: 11px; opacity: 0.85; }
    </style>
</head>
<body>
    <div id="badge" class="badge off">
        <span class="dot"></span>
        <span class="title" id="badgeTitle">Reconocimiento de miembros</span>
        <span class="subtitle" id="badgeSubtitle">…</span>
    </div>

    <script>
        // Se cierra solo pasado AUTO_CLOSE_MS, o al hacer clic en cualquier
        // parte de la ventana (Office.context.ui.messageParent avisa al
        // host, que es quien realmente cierra el diálogo).
        const AUTO_CLOSE_MS = 1400;

        function notifyHostAndClose() {
            try {
                Office.context.ui.messageParent(JSON.stringify({ type: "close" }));
            } catch (e) {
                // Si no hay host (por ejemplo, se abrió suelta para probar),
                // se intenta cerrar la propia ventana.
                try { window.close(); } catch (e2) { /* nada más que hacer */ }
            }
        }

        Office.onReady(() => {
            const params = new URLSearchParams(window.location.search);
            const isOn = params.get("state") === "on";

            const el = document.getElementById("badge");
            el.classList.remove("on", "off");
            el.classList.add(isOn ? "on" : "off");
            document.getElementById("badgeSubtitle").textContent = isOn ? "ACTIVADO" : "DESACTIVADO";

            setTimeout(notifyHostAndClose, AUTO_CLOSE_MS);
        });

        document.body.addEventListener("click", notifyHostAndClose);
    </script>
</body>
</html>

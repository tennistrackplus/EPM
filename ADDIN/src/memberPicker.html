<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Seleccionar miembro</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: "Segoe UI", "Segoe UI Web", Arial, sans-serif;
            font-size: 13px; color: #201f1e; background: #ffffff;
        }
        .header {
            padding: 10px 12px 8px; border-bottom: 1px solid #edebe9;
        }
        .header input {
            width: 100%; padding: 6px 8px; border: 1px solid #8a8886;
            border-radius: 2px; font-size: 13px;
        }
        .items {
            overflow-y: auto; height: calc(100% - 96px);
        }
        .item {
            padding: 6px 12px; cursor: pointer; white-space: pre;
        }
        .item:hover { background: #f3f2f1; }
        .empty, .loading, .error {
            padding: 14px; color: #605e5c;
        }
        .error { color: #a80000; }
        .error .errorMsg { margin-bottom: 10px; }
        .error button {
            padding: 6px 14px; border: 1px solid #8a8886; background: #fff;
            border-radius: 2px; cursor: pointer; color: #201f1e;
        }
        .error button:hover { background: #f3f2f1; }
        .spinner {
            display: inline-block; width: 14px; height: 14px; margin-right: 8px;
            border: 2px solid #c8c6c4; border-top-color: #605e5c; border-radius: 50%;
            vertical-align: -2px; animation: draco-spin 0.8s linear infinite;
        }
        @keyframes draco-spin { to { transform: rotate(360deg); } }
        .footer {
            padding: 8px 12px; border-top: 1px solid #edebe9; text-align: right;
        }
        .footer button {
            padding: 6px 14px; border: 1px solid #8a8886; background: #fff;
            border-radius: 2px; cursor: pointer;
        }
        .footer button:hover { background: #f3f2f1; }
    </style>
</head>
<body>
    <div class="header">
        <input type="text" id="searchInput" placeholder="Buscar…" autocomplete="off" />
    </div>
    <div class="items" id="itemsContainer">
        <div class="loading" id="loadingMsg"><span class="spinner"></span>Cargando…</div>
    </div>
    <div class="footer">
        <button id="btnCancel">Cancelar</button>
    </div>

    <script>
        // Buscador de miembros como Office Dialog (v4). Protocolo con el
        // host (openMemberRecognitionPicker en js/commands.js):
        //   diálogo -> host: ready (se repite hasta tener datos), resend,
        //                    loaded (acuse), select, cancel, log
        //   host -> diálogo: begin {round,total,...} + chunk {round,seq,part}
        //                    | error {round,message}
        // IMPORTANTE: el handler de mensajes del host se registra ANTES de
        // mandar "ready" (antes era al revés y, si la consulta ya estaba
        // lista, la respuesta llegaba sin nadie escuchando -> "Cargando…"
        // para siempre).
        const PICKER_BUILD = "2026-10-02-picker-v4";
        let allItems = [];
        let gotData = false;      // datos o error ya pintados
        let sentResult = false;   // ya se ha mandado select/cancel
        let rx = null;            // { round, total, parts[], meta, timer }
        let readyTimer = null;
        let readyTries = 0;

        document.getElementById("searchInput").disabled = true;

        function send(obj) {
            try { Office.context.ui.messageParent(JSON.stringify(obj)); }
            catch (e) { console.error("[MemberPicker] messageParent falló:", e); }
        }

        function log(msg) {
            console.log("[MemberPicker]", msg);
            send({ type: "log", msg: String(msg) });
        }

        function sendResult(obj) {
            if (sentResult) return;
            sentResult = true;
            send(obj);
        }

        function render(items) {
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";
            if (!items.length) {
                container.innerHTML = "<div class='empty'>Sin resultados.</div>";
                return;
            }
            // Pintar decenas de miles de filas bloquea la ventana: se limita
            // y se pide afinar con el buscador.
            const MAX = 2000;
            const frag = document.createDocumentFragment();
            for (const it of items.slice(0, MAX)) {
                const div = document.createElement("div");
                div.className = "item";
                div.textContent = it.text;
                div.addEventListener("click", () => {
                    sendResult({ type: "select", value: it.value, attribute: it.attribute });
                });
                frag.appendChild(div);
            }
            container.appendChild(frag);
            if (items.length > MAX) {
                const more = document.createElement("div");
                more.className = "empty";
                more.textContent = "Mostrando " + MAX + " de " + items.length + ". Escribe en el buscador para afinar.";
                container.appendChild(more);
            }
        }

        function applySearch(term) {
            const t = (term || "").toLowerCase();
            const filtered = t ? allItems.filter(it => it.text.toLowerCase().indexOf(t) !== -1) : allItems;
            render(filtered);
        }

        function showError(message) {
            document.getElementById("searchInput").disabled = true;
            const container = document.getElementById("itemsContainer");
            container.innerHTML = "";
            const div = document.createElement("div");
            div.className = "error";
            const msg = document.createElement("div");
            msg.className = "errorMsg";
            msg.textContent = message;
            const btn = document.createElement("button");
            btn.textContent = "Cerrar";
            btn.addEventListener("click", () => sendResult({ type: "cancel" }));
            div.appendChild(msg);
            div.appendChild(btn);
            container.appendChild(div);
        }

        function stopReady() {
            if (readyTimer) { clearInterval(readyTimer); readyTimer = null; }
        }

        function onData(meta, items) {
            gotData = true;
            stopReady();
            allItems = Array.isArray(items) ? items : [];
            const input = document.getElementById("searchInput");
            input.disabled = false;
            input.value = meta.initialSearch || "";
            if (meta.title) document.title = meta.title;
            applySearch(meta.initialSearch || "");
            input.focus();
            send({ type: "loaded", count: allItems.length });
        }

        function handleHostMessage(arg) {
            let payload;
            try { payload = JSON.parse(arg.message); }
            catch (err) { log("mensaje del host no es JSON"); return; }
            if (!payload || gotData) return;

            if (payload.type === "error") {
                gotData = true;
                stopReady();
                showError(payload.message || "Error cargando los valores.");
                send({ type: "loaded", count: -1 });
                return;
            }

            if (payload.type === "begin") {
                if (rx && rx.timer) clearTimeout(rx.timer);
                rx = { round: payload.round, total: payload.total, parts: new Array(payload.total), got: 0, meta: payload };
                // Si en 5 s no han llegado todos los trozos, se pide reenvío.
                rx.timer = setTimeout(() => {
                    if (!gotData && rx) {
                        log("ronda " + rx.round + " incompleta (" + rx.got + "/" + rx.total + "), pido reenvío");
                        send({ type: "resend", round: rx.round });
                    }
                }, 5000);
                if (payload.total === 0) { clearTimeout(rx.timer); onData(payload, []); }
                return;
            }

            if (payload.type === "chunk") {
                if (!rx || payload.round !== rx.round) return; // resto de un envío anterior
                if (rx.parts[payload.seq] === undefined) { rx.parts[payload.seq] = payload.part; rx.got++; }
                if (rx.got === rx.total) {
                    clearTimeout(rx.timer);
                    let items;
                    try { items = JSON.parse(rx.parts.join("")); }
                    catch (e) {
                        log("error parseando items de la ronda " + rx.round + ": " + e.message);
                        send({ type: "resend", round: rx.round });
                        return;
                    }
                    onData(rx.meta, items);
                }
                return;
            }
        }

        document.getElementById("searchInput").addEventListener("input", (e) => applySearch(e.target.value));
        document.getElementById("btnCancel").addEventListener("click", () => sendResult({ type: "cancel" }));
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") sendResult({ type: "cancel" }); });

        Office.onReady(() => {
            Office.context.ui.addHandlerAsync(
                Office.EventType.DialogParentMessageReceived,
                handleHostMessage,
                (res) => {
                    if (res.status === Office.AsyncResultStatus.Failed) {
                        // Sin DialogApi 1.2 no hay messageChild: no hay forma de recibir datos.
                        showError("Esta versión de Excel no permite enviar datos al buscador (DialogApi 1.2).");
                        log("addHandlerAsync falló: " + (res.error && res.error.message));
                        return;
                    }
                    // Ahora sí: ya hay alguien escuchando. "ready" se repite por si
                    // se pierde algún mensaje; el host ignora los repetidos una vez
                    // ha recibido "loaded".
                    const sendReady = () => {
                        if (gotData || readyTries >= 40) { stopReady(); return; }
                        readyTries++;
                        send({ type: "ready", build: PICKER_BUILD, tries: readyTries });
                    };
                    sendReady();
                    readyTimer = setInterval(sendReady, 1500);
                }
            );
        });
    </script>
</body>
</html>

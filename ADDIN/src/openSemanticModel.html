<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrir modelo semántico (.lkml)</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/lkmlDialog.css">
</head>
<body>

    <div id="appToastContainer" aria-live="polite"></div>

    <div class="dialog-page">

        <div class="dialog-header">
            <h3>Abrir modelo semántico (.lkml)</h3>
            <span class="dialog-subtitle">Importa un modelo desde un repositorio o desde un fichero local</span>
        </div>

        <div class="dialog-body">

            <div class="lkml-tabs">
                <div class="lkml-tab active" id="lkmlTabServer" data-tab="server">Servidor</div>
                <div class="lkml-tab" id="lkmlTabLocal" data-tab="local">Local</div>
            </div>

            <!-- PESTAÑA SERVIDOR: repositorio Git (GitHub/GitLab) de la conexión -->
            <div class="lkml-tab-panel active" id="lkmlPanelServer">
                <label class="lkml-field-label" for="lkmlServerConnection">Conexión</label>
                <select class="lkml-select" id="lkmlServerConnection">
                    <option value="">— Sin conexiones guardadas —</option>
                </select>

                <label class="lkml-field-label" for="lkmlServerPath">Ruta / carpeta en el repositorio</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" class="lkml-input" id="lkmlServerPath" placeholder="raíz del repositorio" style="flex:1;" />
                    <button type="button" class="icon-btn" id="lkmlServerUpBtn" title="Subir un nivel">⬆</button>
                </div>

                <div class="lkml-server-list" id="lkmlServerList">
                    <span class="lkml-empty-hint">Selecciona una conexión para explorar los ficheros .lkml del repositorio.</span>
                </div>
            </div>

            <!-- PESTAÑA LOCAL: fichero .lkml del equipo del usuario -->
            <div class="lkml-tab-panel" id="lkmlPanelLocal">
                <div class="lkml-dropzone" id="lkmlDropzone">
                    <span class="lkml-file-icon">📄</span>
                    Arrastra aquí un fichero <strong>.lkml</strong> o haz clic para buscarlo en tu equipo
                </div>
                <input type="file" id="lkmlFileInput" accept=".lkml" style="display:none;" />
                <div class="lkml-selected-file" id="lkmlSelectedFile">
                    <span>📄</span>
                    <span id="lkmlSelectedFileName"></span>
                </div>
            </div>

        </div>

        <div class="lkml-modal-footer">
            <button type="button" class="icon-btn" id="btnCancelOpenLkml">Cancelar</button>
            <button type="button" class="btn-generate" id="btnConfirmOpenLkml" disabled>Seleccionar</button>
        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/connections.js"></script>
    <script src="js/gitRepo.js"></script>
    <script src="js/openSemanticModelDialog.js"></script>
</body>
</html>

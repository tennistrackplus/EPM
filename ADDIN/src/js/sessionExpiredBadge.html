<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Conexión</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: "Segoe UI", "Segoe UI Web", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff; cursor: pointer; overflow: hidden;
        }
        /* Mismo aspecto que recognitionBadge.html (Reconocimiento de miembros) */
        .badge {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; text-align: center; padding: 8px;
            color: #ffffff; background: #a4262c;   /* rojo: sesión caducada */
        }
        .badge.off { background: #605e5c; }    /* gris: sin conexión */
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.9); }
        .title { font-size: 13px; font-weight: 600; line-height: 1.3; }
        .subtitle { font-size: 11px; opacity: 0.85; }
    </style>
</head>
<body>
    <div id="badge" class="badge">
        <span class="dot"></span>
        <span class="title" id="badgeTitle">Sesión caducada</span>
        <span class="subtitle" id="badgeSubtitle">Datos sin actualizar</span>
    </div>

    <script>
        // Se cierra solo pasado AUTO_CLOSE_MS, o al hacer clic (como el de
        // Reconocimiento de miembros). Solo avisa: no hace nada más.
        const AUTO_CLOSE_MS = 2500;

        function notifyHostAndClose() {
            try {
                Office.context.ui.messageParent(JSON.stringify({ type: "close" }));
            } catch (e) {
                try { window.close(); } catch (e2) { /* nada más que hacer */ }
            }
        }

        Office.onReady(() => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("expired") === "0") {
                document.getElementById("badge").classList.add("off");
                document.getElementById("badgeTitle").textContent = "Sin conexión";
            }
            setTimeout(notifyHostAndClose, AUTO_CLOSE_MS);
        });

        document.body.addEventListener("click", notifyHostAndClose);
    </script>
</body>
</html>

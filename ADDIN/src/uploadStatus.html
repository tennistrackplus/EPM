<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar en bucket</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: var(--font-family, -apple-system, Segoe UI, Arial, sans-serif);
        }
        .wrap {
            box-sizing: border-box;
            height: 100%;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .status-icon { font-size: 30px; margin-bottom: 8px; }
        #msg {
            font-size: 12.5px;
            color: #333;
            word-break: break-word;
            line-height: 1.4;
        }
        button {
            margin-top: 16px;
            padding: 7px 18px;
            font-size: 12.5px;
            border: none;
            border-radius: 4px;
            background: #7045A9;
            color: #fff;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="wrap">
        <div id="icon" class="status-icon"></div>
        <div id="msg"></div>
        <button id="btnClose" type="button">Cerrar</button>
    </div>

    <script>
        function init() {
            const params = new URLSearchParams(window.location.search);
            const ok = params.get("ok") === "1";
            const msg = params.get("msg") || "";

            document.getElementById("icon").textContent = ok ? "✅" : "⚠️";
            document.getElementById("msg").textContent = ok
                ? msg
                : ("No se pudo subir el archivo: " + msg);

            document.getElementById("btnClose").addEventListener("click", () => {
                try {
                    Office.context.ui.messageParent("close");
                } catch (e) {
                    window.close();
                }
            });
        }

        if (typeof Office !== "undefined") {
            Office.onReady(init);
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    </script>
</body>
</html>

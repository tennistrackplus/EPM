<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPM Data Studio · Modelo semántico</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            padding: 0;
        }
        .page-content {
            padding: 14px;
        }
        h3, h4 {
            color: var(--text-primary);
        }
        h3 {
            font-size: var(--fs-md);
            font-weight: 700;
            letter-spacing: 0.2px;
            margin-bottom: 12px;
        }
        h4 {
            font-size: var(--fs-sm);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            margin: 16px 0 8px 0;
        }
        .card {
            padding: 16px;
            margin-bottom: 14px;
        }

        .card.compact {
            padding: 10px 12px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        /* ---- Gestión de modelos semánticos (crear / editar / eliminar) ---- */
        .model-manager-row {
            display: flex;
            align-items: stretch;
            gap: 6px;
        }

        .model-manager-select {
            flex: 1;
            min-width: 0;
        }

        .model-manager-select select {
            width: 100%;
        }

        .model-manager-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 30px;
            height: auto;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            background-color: var(--surface-card);
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
        }

        .icon-btn:hover {
            background-color: var(--gray-100);
            color: var(--text-primary);
            border-color: var(--gray-400);
        }

        .icon-btn.danger:hover {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
            border-color: #F3C9C6;
        }

        .card-divider {
            height: 1px;
            background-color: var(--border-subtle);
            margin: 8px 0;
        }

        /* Compacta: sin labels visibles, solo placeholder + icono */
        .compact-field-group {
            margin: 0;
        }

        /* Estilo de ayuda de búsqueda (SAP Matchcode) */
        .sap-search-input-group {
            display: flex;
            align-items: stretch;
        }
        .sap-search-input-group input[type="text"] {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }
        .sap-search-btn {
            background-color: var(--brand-primary);
            color: var(--text-inverse);
            border: 1px solid var(--brand-primary);
            padding: 0 13px;
            border-top-right-radius: var(--radius-sm);
            border-bottom-right-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--fs-base);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-fast);
        }
        .sap-search-btn:hover {
            background-color: var(--brand-primary-hover);
        }
        table {
            margin-top: 6px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        th:first-child, td:first-child {
            padding-left: 12px;
        }
        .btn {
            width: 100%;
            margin-top: 12px;
        }
        .btn-secondary {
            background-color: var(--surface-card);
            color: var(--text-primary);
        }
        .btn-sm {
            width: auto;
            margin-top: 0;
        }
        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 27, 51, 0.45);
            backdrop-filter: blur(1px);
            z-index: 100;
            overflow-y: auto;
        }
        #treeModal {
            z-index: 200;
        }
        .modal-content {
            background-color: var(--surface-card);
            margin: 24px auto;
            padding: 18px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            width: 90%;
            max-width: 480px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .modal-header h3 {
            margin: 0;
        }
        .modal-close {
            color: var(--text-muted);
            font-size: 20px;
            font-weight: 400;
            cursor: pointer;
            line-height: 1;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }
        .modal-close:hover {
            background-color: var(--gray-100);
            color: var(--text-primary);
        }
        /* Árbol jerárquico de selección de tabla */
        .tree-container {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 10px;
            background: var(--surface-sunken);
        }
        .tree-list {
            list-style: none;
            padding-left: 16px;
            margin: 0;
        }
        .tree-container > .tree-list {
            padding-left: 0;
        }
        .tree-item {
            margin-top: 3px;
        }
        .tree-header {
            cursor: pointer;
            user-select: none;
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            font-size: var(--fs-base);
            display: block;
            transition: background-color var(--transition-fast);
        }
        .tree-header:hover {
            background-color: var(--gray-100);
        }
        .tree-toggle {
            display: inline-block;
            width: 14px;
            font-size: 9px;
            color: var(--text-muted);
        }
        .tree-children {
            display: none;
        }
        .tree-children.open {
            display: block;
        }
        .table-item {
            color: var(--brand-primary);
            font-weight: 700;
        }
        .table-item:hover {
            background-color: var(--brand-primary);
            color: var(--text-inverse);
        }


.fields-list{
    border:1px solid var(--border-subtle);
    border-radius:var(--radius-md);
    overflow:hidden;
    background:var(--surface-card);
}

.field-row{

    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 14px;

    cursor:pointer;

    border-bottom:1px solid var(--border-subtle);

    transition:background .15s;

}

.field-row:last-child{
    border-bottom:none;
}

.field-row:hover{
    background:var(--gray-100);
}

.field-badge{
    width:42px;
    height:22px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.4px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.field-badge.dimension{
    background:#E8F0FE;
    color:#1A73E8;
}

.field-badge.measure{
    background:#E8F5E9;
    color:#188038;
}

.field-info{

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;

    min-width:0;

}

.field-name{

    margin-top:2px;

    font-size:11px;

    line-height:16px;

    color:var(--text-muted);

    font-family:Consolas, monospace;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}
.field-alias{
    margin-top:2px;
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.field-arrow{
    color:var(--text-muted);
    font-size:20px;
    line-height:1;
    flex-shrink:0;
}


.field-enable{

    width:14px;
    height:14px;

    margin:0 4px 0 0;

    flex-shrink:0;

    cursor:pointer;

    accent-color:var(--brand-primary);

}


.field-type{

    width:58px;
    height:24px;

    border:1px solid var(--border-subtle);

    border-radius:999px;

    background:#F8F9FA;

    color:var(--text-secondary);

    font-size:10px;

    font-weight:700;

    padding:0 4px;

    flex-shrink:0;

}


.field-alias-input{

    width:100%;

    padding:0;

    margin:0;

    border:none;

    outline:none;

    background:transparent;

    font-size:14px;

    font-weight:600;

    line-height:20px;

    color:var(--text-primary);

}

.field-alias-input:focus{

    border-bottom:1px solid var(--brand-primary);

}

.field-name{

    margin-top:3px;

    font-size:12px;

    color:var(--text-muted);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}
		

.field-key{

    display:flex;

    align-items:center;

    gap:6px;

    flex-shrink:0;

    font-size:12px;

    color:var(--text-secondary);

    font-weight:600;

}

.field-key input{

    margin:0;

}

    </style>
</head>
<body>

    <div class="page-content">

        <!-- MODELO SEMÁNTICO + TABLA DE HECHOS (misma tarjeta, sin títulos, máxima compacidad) -->
        <div class="card compact">

            <!-- Gestión de modelos: crear / editar / eliminar -->
            <div class="model-manager-row">
			
			
			
			<div id="modelSelectorContainer">

    <select id="semanticModelSelect">
        <option value="">— Sin modelo seleeeeccionado —</option>
    </select>

</div>
                <div class="model-manager-actions">
                    <button type="button" class="icon-btn" id="btnNewModel" title="Crear nuevo modelo">+ASD</button>
                    <button type="button" class="icon-btn danger" id="btnDeleteModel" title="Eliminar modelo">🗑</button>
                </div>
            </div>

            <div class="card-divider"></div>

            <!-- Tabla de hechos -->
            <div class="compact-field-group">
                <div class="sap-search-input-group">
                    <input type="text" id="factFullConcat" readonly placeholder="Tabla de hechos (proyecto.dataset.tabla)" aria-label="Tabla de hechos seleccionada" title="Tabla de hechos seleccionada" style="cursor: pointer;" />
                    <button type="button" class="sap-search-btn" id="sapSearchBtn" title="Ayuda de búsqueda (F4)">🔍</button>
                </div>
                <input type="hidden" id="factProject" />
                <input type="hidden" id="factDataset" />
                <input type="hidden" id="factTable" />
            </div>
        </div>

        <!-- LISTA DE CAMPOS -->

<div class="card" id="fieldsCard" style="display: none;">
    <h3>Campos</h3>

    <div id="fieldsList" class="fields-list">
        <!-- Se rellena dinámicamente desde semantic_model.js -->
    </div>

    <button class="btn" id="btnGenerateModel">
        Generar modelo semántico en Excel
    </button>
</div>

    </div>
    <!-- MODAL SELECCIÓN JERÁRQUICA DE TABLA -->
    <div id="treeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Seleccionar tabla de BigQuery</h3>
                <span class="modal-close" id="btnCloseTreeModal">&times;</span>
            </div>
            <div id="treeContainer" class="tree-container"></div>
        </div>
    </div>
    <!-- MODAL CONFIGURACIÓN MEDIDA -->
    <div id="measureModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Medida: <span id="modalMeasureFieldName"></span></h3>
                <span class="modal-close" id="btnCloseMeasureModal">&times;</span>
            </div>
            <div class="form-group">
                <label>Alias</label>
                <input type="text" id="modalMeasureAlias" />
            </div>
            <div class="form-group">
                <label>Agregación</label>
                <select id="modalMeasureAgg">
                    <option value="SUM">SUM</option>
                    <option value="COUNT">COUNT</option>
                    <option value="AVG">AVG</option>
                    <option value="MIN">MIN</option>
                    <option value="MAX">MAX</option>
                    <option value="COUNT_DISTINCT">COUNT_DISTINCT</option>
                </select>
            </div>
            <div class="form-group">
                <label>Formato</label>
                <select id="modalMeasureFormat">
                    <option value="Auto">Auto</option>
                    <option value="Currency">Moneda (€)</option>
                    <option value="Integer">Entero</option>
                    <option value="Decimal">Decimal</option>
                    <option value="Percent">Porcentaje (%)</option>
                </select>
            </div>
            <button class="btn" id="btnSaveMeasureModal">Guardar medida</button>
        </div>
    </div>
    <!-- MODAL CONFIGURACIÓN DIMENSIÓN -->
    <div id="dimensionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Dimensión: <span id="modalDimFieldName"></span></h3>
                <span class="modal-close" id="btnCloseDimModal">&times;</span>
            </div>
            <div class="form-group">
                <label>Alias</label>
                <input type="text" id="modalDimAlias" />
            </div>
            <h4>Tabla de atributos (relación)</h4>
            <div class="form-group">
                <label>Tabla de dimensión seleccionada</label>
                <div class="sap-search-input-group">
                    <input type="text" id="dimRelFullConcat" readonly placeholder="Seleccionar tabla de dimensión..." style="cursor: pointer;" />
                    <button type="button" class="sap-search-btn" id="dimSapSearchBtn" title="Ayuda de búsqueda (F4)">🔍</button>
                </div>
                <input type="hidden" id="dimRelProject" />
                <input type="hidden" id="dimRelDataset" />
                <input type="hidden" id="dimRelTable" />
            </div>

<div id="attributesContainer" style="display:none; margin-top:15px;">

    <h4>Atributos</h4>

    <div id="attributesList" class="fields-list">
        <!-- Se rellena dinámicamente -->
    </div>

</div>

            <button class="btn" id="btnSaveDimModal" style="margin-top: 15px;">Guardar dimensión</button>
        </div>
    </div>
    <script src="js/semantic_model.js"></script>
</body>
</html>

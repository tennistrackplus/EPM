<html lang="en">

  <title>BigQuery Excel Connector</title>
  <link rel="stylesheet" href="css/variables.css">

<body class="ms-FluentBody">
  <div id="app-root" class="app-shell">
    
    <!-- Top Bar Navigation / Header -->
    <header class="app-header">
      <div class="app-header-left">
        <button id="btn-sidebar-toggle" class="btn-icon" aria-label="Toggle Navigation">
          <svg class="fluent-icon" viewBox="0 0 20 20" width="16" height="16">
            <path d="M2 4.5C2 4.22386 2.22386 4 2.5 4H17.5C17.7761 4 18 4.22386 18 4.5C18 4.77614 17.7761 5 17.5 5H2.5C2.22386 5 2 4.77614 2 4.5ZM2 9.5C2 9.22386 2.22386 9 2.5 9H17.5C17.7761 9 18 9.22386 18 9.5C18 9.77614 17.7761 10 17.5 10H2.5C2.22386 10 2 9.77614 2 9.5ZM2 14.5C2 14.2238 2.22386 14 2.5 14H17.5C17.7761 14 18 14.2238 18 14.5C18 14.7761 17.7761 15 17.5 15H2.5C2.22386 15 2 14.7761 2 14.5Z" fill="currentColor"/>

      </div>
      <div class="app-header-right">
        <div id="connection-status-badge" class="status-indicator status-disconnected" title="Disconnected"></div>
        <button id="btn-profile-shortcut" class="btn-icon profile-avatar-btn" aria-label="User Profile">
          <div class="avatar-placeholder">US</div>
        </button>
      </div>
    </header>

      <!-- Main Content Stage Dynamic Mount Point -->
      <main id="main-content" class="app-stage">
        <!-- Dynamic Page Container Mount Point -->
        <div id="page-mount" class="page-container"></div>
      </main>
    </div>

    <!-- Global Toast / Notification Host -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Global Dialog / Modal Overlay Host -->
    <div id="modal-container" class="modal-container" aria-hidden="true"></div>

  </div>

  <!-- JavaScript Entry Point -->
  <script type="module" src="js/app.js"></script>

</html>
